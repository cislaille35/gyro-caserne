name: Déployer la refonte

# Le temps de la refonte (décision 0022) : chaque poussée sur refonte-ui donne une version d'essai à son adresse.
# La préprod et ses tâches planifiées ne changent pas. Même base que la préprod : aucune migration dans la refonte.
# À retirer avant la fusion sur main.
on:
  push:
    branches: [refonte-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    if: github.ref == 'refs/heads/refonte-ui' && vars.CENTRE_PREPROD == 'exemple'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploiement-refonte
      cancel-in-progress: true
    env:
      CENTRE: ${{ vars.CENTRE_PREPROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyro-caserne/web exec vite build
      # Les secrets restent ceux de la préprod ; seule l'adresse des liens de connexion change.
      - name: Version d'essai
        working-directory: apps/web
        run: pnpm exec wrangler versions upload --config ../../centres/$CENTRE/wrangler.jsonc --preview-alias refonte --var BETTER_AUTH_URL:https://refonte-gyro-caserne-$CENTRE.cis-laille.workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
