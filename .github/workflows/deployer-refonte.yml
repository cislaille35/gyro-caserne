name: Version d'essai de la refonte

# À chaque poussée sur la branche de la refonte, une version d'essai du Worker de préprod (centre fictif).
# Elle ne remplace pas la version en ligne et ne touche pas à la base. À retirer à la fin de la refonte (décision 0026).
on:
  push:
    branches: [fonction/refonte-ui]

permissions:
  contents: read

jobs:
  verifier:
    uses: ./.github/workflows/verifier.yml
    with:
      complet: false

  essai:
    needs: verifier
    runs-on: ubuntu-latest
    concurrency:
      group: version-essai-refonte
      cancel-in-progress: true
    env:
      CENTRE: exemple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyro-caserne/web build
      # Les liens de connexion mènent à la version d'essai, pas à la préprod.
      - run: >-
          pnpm --filter @gyro-caserne/web exec wrangler versions upload
          --config ../../centres/exemple/wrangler.jsonc
          --preview-alias refonte
          --var BETTER_AUTH_URL:https://refonte-gyro-caserne-exemple.cis-laille.workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
