name: Comptes de test

# Lancé à la main : ajoute à la préprod un compte par profil (boîte+chef, boîte+agent…) et des publications fictives.
# Relançable : complète ce qui manque sans dupliquer. Refusé hors du centre exemple.
on:
  workflow_dispatch:
    inputs:
      boite:
        description: 'Boîte qui reçoit les liens de connexion (ex. caserne@exemple.fr)'
        required: true

permissions:
  contents: read

jobs:
  preprod:
    # Depuis main seulement, et pour la préprod du centre exemple (le script le vérifie aussi).
    if: github.ref == 'refs/heads/main' && vars.CENTRE_PREPROD == 'exemple'
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement-preprod
      cancel-in-progress: false
    env:
      CENTRE: ${{ vars.CENTRE_PREPROD }}
      BOITE: ${{ inputs.boite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # La boîte passe par une variable, jamais collée dans la commande.
      - run: pnpm --filter @gyro-caserne/web jeu-de-depart --en-ligne "--comptes-de-test=$BOITE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
