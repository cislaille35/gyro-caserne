name: Essai vigilance (jetable)
on:
  push:
    branches: [technique/cle-vigilance]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vraie réponse lue par lireVigilance
        run: |
          cat > packages/socle/essai.ts <<'JS'
          import { lireVigilance, URL_VIGILANCE } from './src/meteo.ts';
          const r = await fetch(URL_VIGILANCE, { headers: { apikey: process.env.VIGILANCE_CLE ?? '', accept: 'application/json' } });
          console.log('statut HTTP', r.status);
          const json = await r.json();
          const periodes = json?.product?.periods ?? [];
          console.log('échéances', periodes.map((p) => p?.echeance));
          const aujourdhui = new Date().toISOString().slice(0, 10);
          console.log('lu pour le 35', JSON.stringify(lireVigilance(json, '35', aujourdhui)));
          const d = periodes[0]?.timelaps?.domain_ids?.find((x) => String(x?.domain_id) === '35');
          console.log('brut 35 (J)', JSON.stringify(d));
          JS
          node --experimental-transform-types packages/socle/essai.ts
        env:
          VIGILANCE_CLE: ${{ secrets.VIGILANCE_CLE }}
