name: Vérifier

on:
  pull_request:
  workflow_dispatch: # relance manuelle (onglet Actions → Run workflow)
  workflow_call: # appelé par deployer.yml avant chaque déploiement

# Lecture seule : la vérification ne modifie rien dans le dépôt
permissions:
  contents: read

# Une nouvelle poussée annule la vérification en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      # Actions figées par leur empreinte de commit, version en commentaire
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
