name: Vérifier

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: # relance manuelle (onglet Actions → Run workflow)
  workflow_call: # appelé par deployer.yml avant chaque déploiement

# Lecture seule : la vérification ne modifie rien dans le dépôt
permissions:
  contents: read

# Une nouvelle poussée annule la vérification en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR en brouillon : vérification rapide (tests, compilation).
# Vérification complète (types, accessibilité) quand la PR passe « prête », à la relance manuelle et avant chaque déploiement.
env:
  COMPLET: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      # Actions figées par leur empreinte de commit, version en commentaire
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.COMPLET == 'true'
        run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Polices en fichiers .woff2 servis par l'appli : une police glissée dans le CSS (data:) serait bloquée par la CSP
      - name: Polices servies en fichiers
        run: |
          ls apps/web/.svelte-kit/cloudflare/_app/immutable/assets/*.woff2
          ! grep -l 'data:font' apps/web/.svelte-kit/cloudflare/_app/immutable/assets/*.css
      - if: env.COMPLET == 'true'
        run: pnpm --filter @gyro-caserne/web exec playwright install --with-deps chromium
      - if: env.COMPLET == 'true'
        run: pnpm --filter @gyro-caserne/web test:a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-accessibilite
          path: |
            apps/web/test-results
            apps/web/playwright-report
