name: Déployer

# Préprod à chaque fusion sur main ; production sur un tag vX.Y.Z posé sur main.
# Le centre de chaque environnement vient des variables du dépôt (CENTRE_PREPROD, CENTRE_PRODUCTION) :
# sans elles (copie d'un autre centre qui n'a rien configuré), rien n'est déployé.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verifier:
    uses: ./.github/workflows/verifier.yml
    # Vérification complète pour la production seulement : la préprod part d'une PR déjà vérifiée en entier.
    with:
      complet: ${{ startsWith(github.ref, 'refs/tags/v') }}

  preprod:
    needs: verifier
    if: github.ref == 'refs/heads/main' && vars.CENTRE_PREPROD != ''
    runs-on: ubuntu-latest
    # Un déploiement en cours n'est jamais interrompu : le suivant attend
    concurrency:
      group: deploiement-preprod
      cancel-in-progress: false
    env:
      CENTRE: ${{ vars.CENTRE_PREPROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Les secrets Cloudflare ne sont donnés qu'aux deux étapes qui écrivent en ligne.
      # Si la mise à jour de la base échoue, l'appli n'est pas déployée.
      - run: pnpm --filter @gyro-caserne/web base-en-ligne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm deployer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Clés des notifications au téléphone (secrets du dépôt VAPID_PUBLIQUE_PREPROD et VAPID_PRIVEE_PREPROD), posées sur le Worker.
      # Sans elles, rien n'est posé : l'appli marche, sans notifications au téléphone.
      - name: Clés des notifications
        run: |
          if [ -z "$VAPID_PUBLIQUE" ] || [ -z "$VAPID_PRIVEE" ]; then echo "Pas de clés VAPID : rien à poser."; exit 0; fi
          node -e 'process.stdout.write(JSON.stringify({ VAPID_PUBLIQUE: process.env.VAPID_PUBLIQUE, VAPID_PRIVEE: process.env.VAPID_PRIVEE }))' \
            | pnpm --filter @gyro-caserne/web exec wrangler secret bulk --config ../../centres/$CENTRE/wrangler.jsonc
        env:
          VAPID_PUBLIQUE: ${{ secrets.VAPID_PUBLIQUE_PREPROD }}
          VAPID_PRIVEE: ${{ secrets.VAPID_PRIVEE_PREPROD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Clé de la vigilance Météo-France (secret du dépôt VIGILANCE_CLE), posée sur le Worker. Sans elle, l'appli marche, sans bandeau de vigilance.
      - name: Clé de la vigilance
        run: |
          if [ -z "$VIGILANCE_CLE" ]; then echo "Pas de clé de vigilance : rien à poser."; exit 0; fi
          node -e 'process.stdout.write(JSON.stringify({ VIGILANCE_CLE: process.env.VIGILANCE_CLE }))' \
            | pnpm --filter @gyro-caserne/web exec wrangler secret bulk --config ../../centres/$CENTRE/wrangler.jsonc
        env:
          VIGILANCE_CLE: ${{ secrets.VIGILANCE_CLE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    needs: verifier
    if: startsWith(github.ref, 'refs/tags/v') && vars.CENTRE_PRODUCTION != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    # Seul ce job écrit dans le dépôt : la fiche de version
    permissions:
      contents: write
    env:
      CENTRE: ${{ vars.CENTRE_PRODUCTION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Le jeton d'écriture ne reste pas dans le dépôt cloné : seule la fiche de version l'utilise
          persist-credentials: false
      - name: Le tag pointe sur main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Le tag doit pointer sur un commit de main"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyro-caserne/web base-en-ligne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm deployer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Clés des notifications au téléphone (secrets du dépôt VAPID_PUBLIQUE_PRODUCTION et VAPID_PRIVEE_PRODUCTION), posées sur le Worker.
      # Sans elles, rien n'est posé : l'appli marche, sans notifications au téléphone.
      - name: Clés des notifications
        run: |
          if [ -z "$VAPID_PUBLIQUE" ] || [ -z "$VAPID_PRIVEE" ]; then echo "Pas de clés VAPID : rien à poser."; exit 0; fi
          node -e 'process.stdout.write(JSON.stringify({ VAPID_PUBLIQUE: process.env.VAPID_PUBLIQUE, VAPID_PRIVEE: process.env.VAPID_PRIVEE }))' \
            | pnpm --filter @gyro-caserne/web exec wrangler secret bulk --config ../../centres/$CENTRE/wrangler.jsonc
        env:
          VAPID_PUBLIQUE: ${{ secrets.VAPID_PUBLIQUE_PRODUCTION }}
          VAPID_PRIVEE: ${{ secrets.VAPID_PRIVEE_PRODUCTION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Clé de la vigilance Météo-France (secret du dépôt VIGILANCE_CLE), posée sur le Worker. Sans elle, l'appli marche, sans bandeau de vigilance.
      - name: Clé de la vigilance
        run: |
          if [ -z "$VIGILANCE_CLE" ]; then echo "Pas de clé de vigilance : rien à poser."; exit 0; fi
          node -e 'process.stdout.write(JSON.stringify({ VIGILANCE_CLE: process.env.VIGILANCE_CLE }))' \
            | pnpm --filter @gyro-caserne/web exec wrangler secret bulk --config ../../centres/$CENTRE/wrangler.jsonc
        env:
          VIGILANCE_CLE: ${{ secrets.VIGILANCE_CLE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Journal des mises en production : une fiche par version réellement déployée
      - name: Fiche de version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
