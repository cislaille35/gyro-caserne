name: Déployer

# Préprod à chaque fusion sur main ; production sur un tag vX.Y.Z posé sur main.
# Le centre de chaque environnement vient des variables du dépôt (CENTRE_PREPROD, CENTRE_PRODUCTION) :
# sans elles (copie d'un autre centre qui n'a rien configuré), rien n'est déployé.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verifier:
    uses: ./.github/workflows/verifier.yml

  preprod:
    needs: verifier
    if: github.ref == 'refs/heads/main' && vars.CENTRE_PREPROD != ''
    runs-on: ubuntu-latest
    # Un déploiement en cours n'est jamais interrompu : le suivant attend
    concurrency:
      group: deploiement-preprod
      cancel-in-progress: false
    env:
      CENTRE: ${{ vars.CENTRE_PREPROD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Si la mise à jour de la base échoue, l'appli n'est pas déployée
      - run: pnpm --filter @gyro-caserne/web base-en-ligne
      - run: pnpm deployer

  production:
    needs: verifier
    if: startsWith(github.ref, 'refs/tags/v') && vars.CENTRE_PRODUCTION != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    # Seul ce job écrit dans le dépôt : la fiche de version
    permissions:
      contents: write
    env:
      CENTRE: ${{ vars.CENTRE_PRODUCTION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Le tag pointe sur main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Le tag doit pointer sur un commit de main"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyro-caserne/web base-en-ligne
      - run: pnpm deployer
      # Journal des mises en production : une fiche par version réellement déployée
      - name: Fiche de version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
