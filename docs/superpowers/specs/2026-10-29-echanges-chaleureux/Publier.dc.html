<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Publier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f4c8a}a:hover{color:#b3121f}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; box-sizing: border-box; background: #f6f3ef; color: #1d2733; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="padding: 12px 16px; display: flex; align-items: center; gap: 8px; background: #ffffff; border-bottom: 1px solid #e3ddd5;">
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; color: #1d2733; text-decoration: none; font-weight: 600;">Annuler</a>
    <h1 style="flex: 1; margin: 0; text-align: center; font: 700 22px 'Barlow Condensed', sans-serif;">Nouvelle publication</h1>
    <span style="width: 60px;"></span>
  </header>

  <form style="padding: 16px; display: flex; flex-direction: column; gap: 18px;">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="font-weight: 700; padding: 0 0 8px;">Où publier ?</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <label style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #d4a017; background: #fbf1d3; display: flex; align-items: center; gap: 8px; font-weight: 600;"><input type="radio" name="mur" checked style="margin: 0;"> Équipe 1</label>
        <label style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #e3ddd5; background: #ffffff; display: flex; align-items: center; gap: 8px; font-weight: 600;"><input type="radio" name="mur" style="margin: 0;"> Vie du centre</label>
        <label style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #e3ddd5; background: #ffffff; display: flex; align-items: center; gap: 8px; font-weight: 600;"><input type="radio" name="mur" style="margin: 0;"> Amicale</label>
      </div>
      <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; background: #fbf1d3; color: #6b4a00; padding: 10px 12px; border-radius: 12px;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>Visible par les <strong>9 membres de l’équipe 1</strong>, le chef et l’adjoint.</span>
      </p>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0;">
      <legend style="font-weight: 700; padding: 0 0 8px;">Quel genre ?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <label style="min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 2px solid #1d2733; background: #ffffff; display: flex; align-items: center; gap: 10px;"><input type="radio" name="genre" style="margin: 0;"><span style="display: flex; flex-direction: column;"><strong>Message</strong><span style="font-size: 13px; color: #4a5562;">pour discuter</span></span></label>
        <label style="min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 1px solid #e3ddd5; background: #ffffff; display: flex; align-items: center; gap: 10px;"><input type="radio" name="genre" style="margin: 0;"><span style="display: flex; flex-direction: column;"><strong>Événement</strong><span style="font-size: 13px; color: #4a5562;">qui vient ?</span></span></label>
        <label style="min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 1px solid #e3ddd5; background: #ffffff; display: flex; align-items: center; gap: 10px;"><input type="radio" name="genre" style="margin: 0;"><span style="display: flex; flex-direction: column;"><strong>Bravo</strong><span style="font-size: 13px; color: #4a5562;">une réussite</span></span></label>
        <label style="min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 1px solid #e3ddd5; background: #ffffff; display: flex; align-items: center; gap: 10px;"><input type="radio" name="genre" style="margin: 0;"><span style="display: flex; flex-direction: column;"><strong>Annonce</strong><span style="font-size: 13px; color: #4a5562;">à lire, modérateurs</span></span></label>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700;">Votre message
      <textarea rows="4" style="border-radius: 14px; border: 1px solid #c3ccd5; padding: 12px; font: 400 16px 'Barlow', sans-serif; resize: vertical;">On organise une sortie bowling après l’astreinte ?</textarea>
    </label>

    <div style="display: flex; gap: 8px;">
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #c3ccd5; background: #ffffff; font: 600 15px 'Barlow', sans-serif;">+ Photos</button>
      <button type="button" aria-expanded="true" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #1d2733; background: #ffffff; font: 600 15px 'Barlow', sans-serif;">− Sondage</button>
    </div>

    <fieldset style="margin: 0; padding: 14px; border: 1px solid #e3ddd5; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column; gap: 12px;">
      <legend style="font-weight: 700; padding: 0 6px;">Sondage</legend>
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600;">Question
        <input value="Quel soir ?" style="min-height: 44px; border-radius: 12px; border: 1px solid #c3ccd5; padding: 0 12px; font: 400 16px 'Barlow', sans-serif;">
      </label>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-weight: 600;">Réponses (2 à 6)</span>
        <input aria-label="Réponse 1" value="Vendredi" style="min-height: 44px; border-radius: 12px; border: 1px solid #c3ccd5; padding: 0 12px; font: 400 16px 'Barlow', sans-serif;">
        <input aria-label="Réponse 2" value="Samedi" style="min-height: 44px; border-radius: 12px; border: 1px solid #c3ccd5; padding: 0 12px; font: 400 16px 'Barlow', sans-serif;">
        <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: none; color: #0f4c8a; font: 600 15px 'Barlow', sans-serif;">+ Ajouter une réponse</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600;">Ouvre le
          <input type="datetime-local" value="2026-10-29T12:00" style="min-height: 44px; border-radius: 12px; border: 1px solid #c3ccd5; padding: 0 8px; font: 400 15px 'Barlow', sans-serif;">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600;">Ferme le
          <input type="datetime-local" value="2026-11-02T20:00" style="min-height: 44px; border-radius: 12px; border: 1px solid #c3ccd5; padding: 0 8px; font: 400 15px 'Barlow', sans-serif;">
        </label>
      </div>
      <p style="margin: 0; font-size: 14px; color: #4a5562;">Ouvert dès la publication par défaut. Fermé, plus personne ne vote et les résultats s’affichent pour tous.</p>
    </fieldset>

    <button type="submit" style="min-height: 52px; border-radius: 999px; border: 0; background: #b3121f; color: #ffffff; font: 700 17px 'Barlow', sans-serif;">Publier dans Équipe 1</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
