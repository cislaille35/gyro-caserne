<style>
body{margin:0}
.a-respire{transform-box:fill-box;transform-origin:50% 100%;animation:g-respire 3.2s ease-in-out infinite}
.a-saute{transform-box:fill-box;transform-origin:50% 100%;animation:g-saute 1.2s ease-out infinite}
.a-penche{transform-box:fill-box;transform-origin:50% 100%;animation:g-penche 2.4s ease-in-out infinite}
.a-clin{transform-box:fill-box;transform-origin:50% 50%;animation:g-clin 5s infinite}
.a-rayonne{animation:g-rayonne 1.6s ease-in-out infinite}
.a-tourne{transform-box:view-box;transform-origin:80px 52px;animation:g-tourne 2.4s linear infinite}
.a-tourne-lent{transform-box:fill-box;transform-origin:50% 50%;animation:g-tourne 12s linear infinite}
.a-zzz{animation:g-zzz 3s ease-out infinite}
.a-scintille{animation:g-scintille 1.4s ease-in-out infinite}
.a-tombe{animation:g-tombe 1.6s linear infinite}
.a-glisse{animation:g-glisse 1.6s ease-in infinite}
.a-coucou{transform-box:fill-box;transform-origin:50% 100%;animation:g-coucou 1.2s ease-in-out infinite}
.a-balance{transform-box:view-box;transform-origin:96px 118px;animation:g-balance 1.8s ease-in-out infinite alternate}
@keyframes g-respire{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,0.975)}}
@keyframes g-saute{0%,100%{transform:translateY(0)}35%,55%{transform:translateY(-12px)}}
@keyframes g-penche{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-12deg)}}
@keyframes g-clin{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.1)}}
@keyframes g-rayonne{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes g-tourne{to{transform:rotate(360deg)}}
@keyframes g-zzz{0%{opacity:0;transform:translate(0,6px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}
@keyframes g-scintille{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes g-tombe{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes g-glisse{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes g-coucou{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
@keyframes g-balance{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){[class^="a-"],[class*=" a-"]{animation:none !important}}
</style>

class Component extends DCLogic {
  renderVals() {
    const t = this.props.tenue ?? 'normal';
    const anime = this.props.anime ?? true;
    const taille = this.props.taille ?? 160;

    const yeux =
      dans(['astreinte', 'recrue', 'orage']) ? 'grands' :
      dans(['nuit', 'canicule']) ? 'fermes' :
      dans(['amicale', 'vacances', 'victoire', 'anniversaire', 'bienvenue', 'saintebarbe', 'bal14', 'galons', 'retraite', 'galette', 'noel', 'nouvelan']) ? 'joyeux' :
      t === 'ete' ? 'soleil' :
      t === 'inquiet' ? 'inquiet' :
      dans(['manoeuvre', 'hiver', 'intervention', 'sport', 'brouillard']) ? 'concentre' :
      dans(['garde', 'formation']) ? 'lecture' :
      dans(['chargement', 'chandeleur']) ? 'haut' :
      dans(['anomalie', 'horsligne']) ? 'bas' :
      dans(['vide', 'halloween']) ? 'cote' : 'normal';
    const bouche =
      dans(['astreinte', 'nuit', 'orage', 'chandeleur', 'nouvelan']) ? 'o' :
      t === 'inquiet' ? 'triste' :
      dans(['anomalie', 'horsligne']) ? 'vague' :
      dans(['garde', 'formation', 'vide', 'brouillard']) ? 'droite' :
      dans(['amicale', 'victoire', 'anniversaire', 'bienvenue', 'saintebarbe', 'bal14', 'galons', 'galette', 'halloween']) ? 'grande' :
      dans(['manoeuvre', 'intervention', 'sport', 'chargement']) ? 'petite' :
      t === 'hiver' ? 'aucune' :
      dans(['ete', 'vacances', 'retraite', 'noel', 'canicule', 'journeenationale']) ? 'large' : 'sourire';
    const decalages = { garde: 'translate(4 20)', anomalie: 'translate(10 20)', ptitdej: 'translate(2 20)', ete: 'translate(16 20)', vacances: 'translate(0 20)', anniversaire: 'translate(2 20)', bienvenue: 'translate(8 20)', horsligne: 'translate(6 20)', sport: 'translate(4 20)', vide: 'translate(2 20)', remplacement: 'translate(20 24)', calendriers: 'translate(4 20)', journeenationale: 'translate(2 20)', retraite: 'translate(4 20)', lavage: 'translate(4 20)', cafe: 'translate(4 20)', chandeleur: 'translate(2 20)', halloween: 'translate(4 20)', canicule: 'translate(4 20)', poisson: 'translate(30 20)' };
    const v = {};

    ['normal', 'grands', 'fermes', 'joyeux', 'soleil', 'inquiet', 'concentre', 'lecture', 'haut', 'bas', 'cote'].forEach((y) => montre('y_' + y, y === yeux));
    ['sourire', 'large', 'o', 'triste', 'vague', 'droite', 'grande', 'petite'].forEach((b) => montre('b_' + b, b === bouche));
    ['normal', 'astreinte', 'garde', 'manoeuvre', 'remplacement', 'anomalie', 'inquiet', 'amicale', 'ptitdej', 'ete', 'hiver', 'nuit', 'vacances', 'pluie', 'vent', 'intervention', 'formation', 'saintebarbe', 'anniversaire', 'bienvenue', 'victoire', 'chargement', 'horsligne', 'sport', 'vide', 'calendriers', 'bal14', 'journeenationale', 'galons', 'recrue', 'retraite', 'lavage', 'cafe', 'galette', 'chandeleur', 'poisson', 'halloween', 'noel', 'nouvelan', 'orage', 'brouillard', 'canicule'].forEach((x) => montre('t_' + x, x === t));
    montre('reflet', !dans(['manoeuvre', 'hiver', 'nuit', 'vacances', 'anomalie', 'intervention', 'formation', 'sport', 'recrue', 'retraite', 'noel']));
    montre('socle', t !== 'hiver');
    const noms = { normal: 'souriant', astreinte: 'en alerte pour l’astreinte', garde: 'avec la check-list de garde', manoeuvre: 'casqué pour la manœuvre', remplacement: 'pour un remplacement', anomalie: 'pansé, avec une clé', inquiet: 'inquiet', amicale: 'en fête', ptitdej: 'avec un croissant', ete: 'en lunettes de soleil', hiver: 'en bonnet et écharpe', nuit: 'endormi', vacances: 'en vacances', pluie: 'sous son parapluie', vent: 'penché par le vent', intervention: 'en casque F1', formation: 'en toque de diplômé', saintebarbe: 'médaillé pour la Sainte-Barbe', anniversaire: 'avec un gâteau d’anniversaire', bienvenue: 'qui salue', victoire: 'qui fête une victoire', chargement: 'gyrophare allumé', horsligne: 'débranché', sport: 'en tenue de sport', vide: 'avec une loupe', calendriers: 'avec ses calendriers', bal14: 'en nœud papillon pour le bal', journeenationale: 'avec fourragère et drapeau', galons: 'avec ses nouveaux galons', recrue: 'en casquette de recrue', retraite: 'à la pêche pour sa retraite', lavage: 'qui lave le camion', cafe: 'avec un café', galette: 'couronné roi', chandeleur: 'qui fait sauter une crêpe', poisson: 'avec un poisson dans le dos', halloween: 'à côté d’une citrouille', noel: 'en bonnet de Noël', nouvelan: 'qui fête la nouvelle année', orage: 'sous l’orage', brouillard: 'dans le brouillard', canicule: 'devant un ventilateur' };
    const a = (nom) => (anime ? nom : '');
    const cl = {
      corps: a(t === 'victoire' ? 'a-saute' : t === 'vent' ? 'a-penche' : 'a-respire'),
      clin: a('a-clin'), rayonne: a('a-rayonne'), tourne: a('a-tourne'), tourneLent: a('a-tourne-lent'),
      zzz: a('a-zzz'), scintille: a('a-scintille'), tombe: a('a-tombe'), glisse: a('a-glisse'),
      coucou: a('a-coucou'), balance: a('a-balance'), saute: a('a-saute'), balancePeche: a('a-coucou')
    };
    return { taille, v, cl, decal: decalages[t] ?? 'translate(20 20)', socle: t === 'nuit' ? '#0f141b' : '#1d2733', label: 'Gyro, ' + (noms[t] ?? t) };
  }
