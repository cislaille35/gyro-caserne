<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nominations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d2733}a:hover{color:#b3121f}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #eef1f4; color: #1d2733; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">
  <header style="background: #b3121f; color: #ffffff; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 13px; opacity: 0.9;">CIS Exemple</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700;">Nominations</h1>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #4a5562;">Rechercher un rôle ou un agent
      <input type="search" placeholder="Ex. pharmacie, Martin" style="min-height: 44px; border: 1px solid #c3ccd5; border-radius: 6px; padding: 0 12px; font: 400 16px 'Barlow', sans-serif; background: #ffffff;">
    </label>

    <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
      <section style="background: #ffffff; border-radius: 14px; border: 1px solid #d5dbe1; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <span style="display: flex; flex-direction: column;">
            <span style="font-weight: 600; font-size: 17px;">{{r.nom}}</span>
            <span style="font-size: 13px; color: #4a5562;">{{r.perimetre}}</span>
          </span>
          <button type="button" onClick="{{r.ouvrir}}" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: none; background: #b3121f; color: #ffffff; font: 600 15px 'Barlow', sans-serif;">Nommer</button>
        </div>
        <sc-if value="{{r.vide}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 14px; color: #7a4a00; background: #fdf1dc; border: 1px solid #e8c88a; border-radius: 6px; padding: 6px 10px;">Aucun titulaire</span>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <sc-for list="{{r.titulaires}}" as="t" hint-placeholder-count="2">
            <span style="display: inline-flex; align-items: center; gap: 4px; border: 1px solid #a9c6e6; background: #e7f0fa; color: #0f4c8a; border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 15px;">{{t}}
              <button type="button" aria-label="Retirer {{t}}" style="width: 32px; height: 32px; border: none; background: transparent; color: #0f4c8a; font-size: 18px;">×</button>
            </span>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <sc-if value="{{ouvert}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17, 23, 31, 0.45); display: flex; align-items: flex-end;">
      <div role="dialog" aria-label="Nommer" style="width: 100%; background: #ffffff; border-radius: 14px 14px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;">Nommer : {{roleOuvert}}</h2>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #4a5562;">Agent
          <input type="search" placeholder="Taper un nom" style="min-height: 44px; border: 1px solid #c3ccd5; border-radius: 6px; padding: 0 12px; font: 400 16px 'Barlow', sans-serif;">
        </label>
        <div style="display: flex; flex-direction: column; border: 1px solid #d5dbe1; border-radius: 8px;">
          <button type="button" style="min-height: 44px; text-align: left; padding: 0 12px; border: none; background: #ffffff; font: 400 16px 'Barlow', sans-serif;">Alice Martin · Équipe 1</button>
          <button type="button" style="min-height: 44px; text-align: left; padding: 0 12px; border: none; border-top: 1px solid #d5dbe1; background: #ffffff; font: 400 16px 'Barlow', sans-serif;">Bruno Petit · Équipe 2</button>
        </div>
        <span style="font-size: 14px; color: #4a5562;">À partir d’aujourd’hui · <a href="#" style="color: #0f4c8a;">changer les dates</a></span>
        <div style="display: flex; gap: 10px;">
          <button type="button" style="flex: 1; min-height: 48px; border-radius: 6px; border: none; background: #b3121f; color: #ffffff; font: 600 17px 'Barlow', sans-serif;">Nommer</button>
          <button type="button" onClick="{{fermer}}" style="flex: 1; min-height: 48px; border-radius: 6px; border: 1px solid #4a5562; background: #ffffff; color: #1d2733; font: 600 17px 'Barlow', sans-serif;">Annuler</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ouvert: null }; }
  renderVals() {
    const defs = [
      { nom: 'Référent engins', perimetre: 'Tout le centre', titulaires: ['David Leroy', 'Chloé Durand'] },
      { nom: 'Référent pharmacie', perimetre: 'Tout le centre', titulaires: [] },
      { nom: 'Chef d’équipe', perimetre: 'Équipe 1', titulaires: ['Alice Martin'] },
      { nom: 'Membre de comité', perimetre: 'Amicale', titulaires: ['Bruno Petit', 'Test Fictif', 'Chloé Durand'] }
    ];
    return {
      roles: defs.map((r) => Object.assign({}, r, { vide: r.titulaires.length === 0, ouvrir: () => this.setState({ ouvert: r.nom }) })),
      ouvert: this.state.ouvert !== null,
      roleOuvert: this.state.ouvert,
      fermer: () => this.setState({ ouvert: null })
    };
  }
}
</script>
</body>
</html>
