<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages du centre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d2733}a:hover{color:#b3121f}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #f6f3ef; color: #1d2733; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="background: #ffffff; border-bottom: 3px solid #b3121f; padding: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 13px; color: #4a5562;">CIS Exemple</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700;">Réglages du centre</h1>
    </div>
    <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: none; background: #b3121f; color: #ffffff; font: 600 15px 'Barlow', sans-serif;">+ Nouveau rôle</button>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{groupes}}" as="g" hint-placeholder-count="4">
      <section style="background: #ffffff; border-radius: 16px; border: 1px solid #e3ddd5; overflow: hidden;">
        <button type="button" aria-expanded="{{g.aria}}" onClick="{{g.basculer}}" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: none; background: {{g.fond}}; text-align: left; font-family: 'Barlow', sans-serif; color: #1d2733;">
          <span style="flex: 1; display: flex; flex-direction: column;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;">{{g.nom}}</span>
            <span style="font-size: 14px; color: #4a5562;">{{g.resume}}</span>
          </span>
          <span aria-hidden="true" style="font-size: 20px; color: #4a5562;">{{g.chevron}}</span>
        </button>
        <sc-if value="{{g.ouvert}}" hint-placeholder-val="{{ true }}">
          <ul style="list-style: none; margin: 0; padding: 0;">
            <sc-for list="{{g.roles}}" as="r" hint-placeholder-count="3">
              <li style="border-top: 1px solid #efe9e2;">
                <a href="Responsabilite.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; text-decoration: none;">
                  <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: {{r.fond}}; color: {{r.couleur}}; display: flex; align-items: center; justify-content: center;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icone}}"/></svg>
                  </span>
                  <span style="flex: 1; display: flex; flex-direction: column;">
                    <span style="font-weight: 600; font-size: 17px;">{{r.nom}}</span>
                    <span style="font-size: 14px; color: {{r.couleurInfo}};">{{r.info}}</span>
                  </span>
                  <span aria-hidden="true" style="font-size: 22px; color: #4a5562;">›</span>
                </a>
              </li>
            </sc-for>
          </ul>
        </sc-if>
      </section>
    </sc-for>
    <button type="button" style="min-height: 44px; border: none; background: transparent; color: #4a5562; font: 500 15px 'Barlow', sans-serif; text-decoration: underline;">Voir les rôles archivés (2)</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ouverts: { referents: true } }; }
  renderVals() {
    const I = {
      etoile: 'M12 3l2.6 5.6 6 .6-4.5 4 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.5-4 6-.6z',
      casque: 'M4 15a8 8 0 0 1 16 0M2 15h20M12 7V4M8 15v2h8v-2',
      camion: 'M3 16V8h11v8M14 11h4l3 3v2h-7M5 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0M15 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0',
      croix: 'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
      cle: 'M14 6a4 4 0 1 0 1.5 3.1L21 15v3h-3v-2h-2v-2l-2.5-2.5',
      sport: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
      livre: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM8 7h7M8 11h7',
      groupe: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M16 14a5 5 0 0 1 5 6',
      coeur: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z'
    };
    const r = (nom, icone, fond, couleur, info, alerte) => ({ nom, icone: I[icone], fond, couleur, info, couleurInfo: alerte ? '#7a4a00' : '#4a5562' });
    const defs = [
      { id: 'commandement', nom: 'Chef de centre et adjoint', resume: '2 rôles · tenus', roles: [r('Chef de centre', 'etoile', '#fbe7e8', '#8a0f19', 'Capitaine Martin'), r('Chef de centre adjoint', 'etoile', '#fbe7e8', '#8a0f19', 'Lieutenant Petit')] },
      { id: 'equipes', nom: 'Chefs d’équipe', resume: '4 équipes · 1 sans chef', roles: [r('Chef d’équipe', 'casque', '#fdeedd', '#9a4b00', '3 sur 4 équipes · Équipe 4 sans chef', true)] },
      { id: 'referents', nom: 'Référents', resume: '4 rôles · 1 sans titulaire', roles: [r('Référent engins', 'camion', '#e7f0fa', '#0f4c8a', 'Personnalisé · 2 titulaires', true), r('Référent pharmacie', 'croix', '#e6f2e2', '#1f5a14', 'Aucun titulaire', true), r('Référent technique', 'cle', '#eceaf6', '#4b3f8a', '1 titulaire'), r('Référent sport', 'sport', '#e3f2f1', '#0f5e58', '1 titulaire')] },
      { id: 'comites', nom: 'Comités', resume: '2 comités', roles: [r('Comité du centre', 'groupe', '#eef1f4', '#4a5562', '5 membres · rapporteur : A. Martin'), r('Amicale', 'coeur', '#fbeaf1', '#8a1f52', '3 membres · pas de rapporteur', true)] }
    ];
    const ouverts = this.state.ouverts;
    const groupes = defs.map((g) => {
      const ouvert = !!ouverts[g.id];
      return Object.assign({}, g, { ouvert, aria: ouvert ? 'true' : 'false', chevron: ouvert ? '⌃' : '⌄', fond: ouvert ? '#fbfaf8' : '#ffffff', basculer: () => this.setState({ ouverts: Object.assign({}, ouverts, { [g.id]: !ouvert }) }) });
    });
    return { groupes };
  }
}
</script>
</body>
</html>
